workflows:
  default-workflow:
    name: Build Android APK (Expo)
    environment:
      node: 18
      npm: 9
      groups:
        - secure   # <- nome do grupo no Codemagic onde está o EXPO_TOKEN
    scripts:
      - npm install -g eas-cli
      - npm ci || npm install
      - echo "🔑 Checando se o EXPO_TOKEN está disponível..."
      - 'if [ -z "$EXPO_TOKEN" ]; then echo "❌ EXPO_TOKEN não encontrado. Configure no grupo secure"; exit 1; fi'
      - eas whoami || echo "⚠️ Não autenticado, verifique o token"
      - eas build -p android --profile preview --non-interactive
    artifacts:
      - ./build/**/*