workflows:
  build-android:
    name: Build Android APK (Expo)
    environment:
      node: latest
      npm: true
      vars:
        EXPO_TOKEN: $EXPO_TOKEN
    scripts:
      - npm install -g eas-cli
      - npm install
      - echo "🔑 Autenticando com Expo..."
      - eas build -p android --profile preview --non-interactive --token $EXPO_TOKEN
    artifacts:
      - build/**/*.apk
